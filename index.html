<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="1.5; url=./studio.html" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Pro</title>
  <style>
    :root {
      --bg: #090d17;
      --bg-2: #101827;
      --panel: rgba(17, 22, 34, 0.9);
      --line: rgba(255,255,255,0.08);
      --text: #eef4ff;
      --muted: #a5b2c7;
      --accent: #8b5cf6;
      --accent-2: #47c7ff;
      --accent-3: #32d5a5;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(760px, 100%);
      background: rgba(17, 23, 38, 0.9);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      padding: 32px 28px;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin-bottom: 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      font-weight: 800;
      font-size: 1.2rem;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .link-wrap {
      margin-top: 22px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 170px;
      padding: 12px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s ease;
    }

    a:hover { transform: translateY(-1px); }

    .primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #07111d;
    }

    .secondary {
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(255,255,255,0.02);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">SP</div>
    <h1>Studio Pro</h1>
    <p>Redirecting to the interactive studio demo…</p>
    <div class="link-wrap">
      <a class="primary" href="./studio.html">Open Studio</a>
      <a class="secondary" href="./Studio%20Pro.html">Open Alternate Studio</a>
    </div>
  </div>
</body>
</html>
